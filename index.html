<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭКО СЛОМ - Демонтж в Москве</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="call-info">📞 11 мин</div>
        <div class="signal">••••••••</div>
    </div>

    <!-- Browser Bar -->
    <div class="browser-bar">
        <div class="browser-content">
            <div class="menu-icon">☰</div>
            <div class="url-bar">ecoslom.ru</div>
            <div class="refresh">⟳</div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="https://via.placeholder.com/180x65/1a472a/ffffff?text=ЭКО+СЛОМ" alt="ЭКО СЛОМ">
            </div>
            <div class="contact-info">
                <div class="phones">
                    <a href="tel:+74958683355">+7 495 868 33 55</a><br>
                    <a href="tel:+79032293355">+7 903 229 33 55</a>
                </div>
                <div class="menu-button">☰</div>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>ДЕМОНТАЖ<br>КВАРТИР, ОФИСОВ И<br>ЗДАНИЙ В<br><span class="orange">МОСКВЕ И ОБЛАСТИ</span></h1>
            <p class="subtitle">
                Честная цена и сроки под ваш объект.<br>
                Работаем по договору, аккуратно и с<br>
                вывозом мусора.
            </p>
            <button class="consult-btn">Получить консультацию</button>
        </div>
    </section>

    <!-- Form Section -->
    <section class="form-section">
        <div class="form-container">
            <h2>УЗНАЙТЕ СТОИМОСТЬ<br>ДЕМОНТАЖА<br>ЗА <span class="orange">15 МИНУТ</span></h2>
            
            <input type="text" placeholder="Имя" class="input-field">
            
            <div class="phone-group">
                <div class="country">
                    <span class="flag">🇷🇺</span>
                    <span>+7</span>
                </div>
                <input type="tel" placeholder="(000) 000-00-00" class="phone-input">
                <button class="send-btn">Напишите нам</button>
            </div>
        </div>
        
        <div class="chat-circle">💬</div>
    </section>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div>←</div>
        <div>→</div>
        <div>↑</div>
        <div>📖</div>
        <div>📋</div>
    </nav>
</body>
</html>
