<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демонтаж помещений</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        ДЕМОНТАЖ<br>
        <span>ПОМЕЩЕНИЙ</span>
    </div>

    <div class="phones">
        <div>+7 495 000 00 00</div>
        <div>+7 903 000 00 00</div>
    </div>

    <div class="menu">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>


<section class="hero">

    <div class="overlay"></div>

    <div class="content">

        <h1>
            ДЕМОНТАЖ<br>
            КВАРТИР, ОФИСОВ И<br>
            ПОМЕЩЕНИЙ В<br>
            <span>МОСКВЕ И ОБЛАСТИ</span>

        <p>
            Честная цена и сроки под ваш объект.<br>
            Работаем по договору, аккуратно и<br>

        </p>


        <button>
            Получить консультацию
        </button>


        <div class="form">

            <h2>
                УЗНАЙТЕ СТОИМОСТЬ<br>
                ДЕМОНТАЖА<br>
                ЗА <span>15</span> МИНУТ
            </h2>


            <input type="text" placeholder="Имя">

            <input type="tel" placeholder="+7 (000) 000-00-00">


            <button class="send">
                Написать нам
            </button>

        </div>

    </div>


</section>


<div class="chat">
    ☰
